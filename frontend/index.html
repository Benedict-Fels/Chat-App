<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .chat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #message-list {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            background: #fafafa;
        }
        .message-item {
            margin-bottom: 10px;
            padding: 8px;
            background: #e9f5ff;
            border-radius: 4px;
        }
        .message-name {
            font-weight: bold;
            font-size: 0.85em;
            color: #0066cc;
            display: block;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, textarea, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>Chat Nachrichten</h2>
    
    <div id="message-list">
    </div>

    <form id="chat-form">
        <input type="text" id="name" placeholder="Dein Name" required>
        <textarea id="message" rows="3" placeholder="Deine Nachricht..." required></textarea>
        <button type="submit">Senden</button>
    </form>
</div>

<script>
    const API_URL = 'http://127.0.0.1:8000/api/chat/';

    // 1. GET: Nachrichten vom Django-Backend laden
    async function fetchMessages() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            const messageList = document.getElementById('message-list');
            messageList.innerHTML = '';

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'message-item';
                div.innerHTML = `
                    <span class="message-name">${item.name || 'Anonym'}</span>
                    <span>${item.message}</span>
                `;
                messageList.appendChild(div);
            });

            // Automatisch nach unten scrollen
            messageList.scrollTop = messageList.scrollHeight;
        } catch (error) {
            console.error('Fehler beim Laden der Nachrichten:', error);
        }
    }

    // 2. POST: Neue Nachricht an Django senden
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const message = document.getElementById('message').value;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, message })
            });

            if (response.ok) {
                document.getElementById('message').value = ''; // Feld leeren
                fetchMessages(); // Liste direkt neu laden
            } else {
                console.error('Fehler beim Senden:', await response.json());
            }
        } catch (error) {
            console.error('Netzwerkfehler:', error);
        }
    });

    fetchMessages();
</script>

</body>
</html>
